name: Actualizar GoldenTech Store

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Actualizar catálogo GoldenTech
        run: python actualizar_goldentech.py

      - name: Guardar catálogo actualizado
        run: |
          git config user.name "TecnoRadar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add goldentechstore_com_ar.json productos.json
          git diff --cached --quiet && exit 0
          git commit -m "Actualizar catálogo GoldenTech Store"
          git push
