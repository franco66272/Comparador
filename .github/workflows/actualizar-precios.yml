name: Actualizar precios TecnoRadar

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar lote de precios
        run: python verificar_precios.py --lote 200 --workers 8 --horas 12

      - name: Guardar datos actualizados
        run: |
          git config user.name "TecnoRadar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add productos.json historial_precios.json detalles_productos.json
          git diff --cached --quiet && exit 0
          git commit -m "Actualizar precios automáticamente"
          git push
