name: Actualizar precios TecnoRadar

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/tiendas_auto.json'
      - 'actualizar.py'
      - 'extractores/**'
      - '.github/workflows/actualizar-precios.yml'

# Evita dos actualizaciones simultáneas intentando escribir main a la vez.
concurrency:
  group: tecnoradar-actualizacion
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Actualizar catálogo completo
        run: python actualizar.py

      - name: Guardar datos actualizados
        run: |
          git config user.name "TecnoRadar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add '*.json'
          git diff --cached --quiet && exit 0
          git commit -m "Actualizar catálogo completo"
          git pull --rebase origin main
          git push origin HEAD:main
