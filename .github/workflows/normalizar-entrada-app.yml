name: Normalizar entrada de app

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/normalizar-entrada-app.yml'

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[skip normalize]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Convertir app.py en entrada optimizada
        shell: bash
        run: |
          set -e
          if [ ! -f app_base.py ]; then
            mv app.py app_base.py
          fi

          python - <<'PY'
          from pathlib import Path

          p = Path('app_optimizado.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('import app as base', 'import app_base as base')
          s = s.replace('from app import app, render_template, request', 'from app_base import app, render_template, request')
          p.write_text(s, encoding='utf-8')

          Path('app.py').write_text('''"""Entrada principal optimizada de TecnoRadar."""\nfrom app_optimizado import app\n\nif __name__ == "__main__":\n    app.run(host="127.0.0.1", port=5000, debug=False)\n''', encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py app_base.py app_optimizado.py
          git diff --cached --quiet && exit 0
          git commit -m "Establecer app.py como entrada optimizada [skip normalize]"
          git push
